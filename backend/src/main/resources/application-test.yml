spring:
  datasource:
    url: jdbc:h2:mem:minimal_agent_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  llm:
    api-key: test-api-key
    base-url: http://localhost:18080
    model: test-model
    connect-timeout: 5s
    response-timeout: 30s
    max-retries: 1
  agent:
    max-steps: 8
    recent-message-count: 12
    compress-message-threshold: 30
    context-token-budget: 12000

logging:
  level:
    com.example.minagent: DEBUG
