version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: minimal-agent-db
    environment:
      POSTGRES_DB: minimal_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d minimal_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
